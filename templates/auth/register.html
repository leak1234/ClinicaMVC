{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1a3a5c,#0d2137);">
    <div class="card p-4" style="width:400px;">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-primary" style="font-size:3rem;"></i>
            <h4 class="mt-2 fw-bold">Crear Cuenta</h4>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Confirmar contraseña</label>
                <input type="password" name="confirm" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-check me-1"></i>Registrarse
            </button>
        </form>
        <div class="text-center mt-3">
            <small><a href="{{ url_for('auth.login') }}">← Volver al login</a></small>
        </div>
    </div>
</div>
{% endblock %}
