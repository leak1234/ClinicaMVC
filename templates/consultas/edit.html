{% extends "base.html" %}
{% block title %}Editar Consulta{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="fw-bold"><i class="bi bi-pencil-square text-warning me-2"></i>Editar Consulta</h4>
</div>
<div class="card p-4" style="max-width:600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
            <input type="date" name="fecha" class="form-control" value="{{ consulta.fecha.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Médico <span class="text-danger">*</span></label>
            <select name="id_medico" class="form-select" required>
                {% for m in medicos %}
                <option value="{{ m.id }}" {% if m.id == consulta.id_medico %}selected{% endif %}>
                    {{ m.nombre }} ({{ m.especialidad }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Paciente <span class="text-danger">*</span></label>
            <select name="id_paciente" class="form-select" required>
                {% for p in pacientes %}
                <option value="{{ p.id }}" {% if p.id == consulta.id_paciente %}selected{% endif %}>
                    {{ p.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Diagnóstico <span class="text-danger">*</span></label>
            <textarea name="diagnostico" class="form-control" rows="3" required>{{ consulta.diagnostico }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Tratamiento <span class="text-danger">*</span></label>
            <textarea name="tratamiento" class="form-control" rows="3" required>{{ consulta.tratamiento }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning"><i class="bi bi-save me-1"></i>Actualizar</button>
            <a href="{{ url_for('consulta.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
