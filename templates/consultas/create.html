{% extends "base.html" %}
{% block title %}Registrar Consulta{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="fw-bold"><i class="bi bi-clipboard2-plus text-primary me-2"></i>Registrar Consulta</h4>
</div>
<div class="card p-4" style="max-width:600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
            <input type="date" name="fecha" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Médico <span class="text-danger">*</span></label>
            <select name="id_medico" class="form-select" required>
                <option value="">-- Seleccionar médico --</option>
                {% for m in medicos %}
                <option value="{{ m.id }}">{{ m.nombre }} ({{ m.especialidad }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Paciente <span class="text-danger">*</span></label>
            <select name="id_paciente" class="form-select" required>
                <option value="">-- Seleccionar paciente --</option>
                {% for p in pacientes %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Diagnóstico <span class="text-danger">*</span></label>
            <textarea name="diagnostico" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Tratamiento <span class="text-danger">*</span></label>
            <textarea name="tratamiento" class="form-control" rows="3" required></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
            <a href="{{ url_for('consulta.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
