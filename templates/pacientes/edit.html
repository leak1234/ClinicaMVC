{% extends "base.html" %}
{% block title %}Editar Paciente{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="fw-bold"><i class="bi bi-pencil-square text-warning me-2"></i>Editar Paciente</h4>
</div>
<div class="card p-4" style="max-width:540px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre completo <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Edad <span class="text-danger">*</span></label>
            <input type="number" name="edad" class="form-control" value="{{ paciente.edad }}" min="0" max="150" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Dirección <span class="text-danger">*</span></label>
            <input type="text" name="direccion" class="form-control" value="{{ paciente.direccion }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Teléfono <span class="text-danger">*</span></label>
            <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono }}" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning"><i class="bi bi-save me-1"></i>Actualizar</button>
            <a href="{{ url_for('paciente.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
